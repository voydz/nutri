name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runs-on: macos-14
          - target: linux-x86_64
            runs-on: ubuntu-latest
            # manylinux pins the glibc floor to 2.28 (Debian 11+, Ubuntu 20.04+,
            # RHEL 8+); building on the runner itself would require glibc 2.39.
            container: quay.io/pypa/manylinux_2_28_x86_64
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup project
        run: |
          uv python install 3.13
          PYTHON_VERSION=3.13 make setup

      - name: Build binary
        run: make build

      - name: Smoke test binary
        run: ./dist/nutri --help

      - name: Package tarball
        run: make package VERSION="${GITHUB_REF_NAME#v}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutri-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release assets and bump tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify Linux binary runs on older distros
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p check
          tar -xzf "artifacts/nutri-cli-${VERSION}-linux-x86_64.tar.gz" -C check
          for image in debian:11 ubuntu:22.04; do
            echo "--- $image"
            docker run --rm -v "$PWD/check:/check:ro" "$image" /check/nutri --help >/dev/null
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/*.tar.gz --clobber

      - name: Render formula
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sha() { cut -d' ' -f1 "artifacts/nutri-cli-${VERSION}-$1.tar.gz.sha256"; }
          sed \
            -e "s/@VERSION@/${VERSION}/g" \
            -e "s/@SHA256_MACOS_ARM64@/$(sha macos-arm64)/" \
            -e "s/@SHA256_LINUX_X86_64@/$(sha linux-x86_64)/" \
            -e "s/@SHA256_LINUX_ARM64@/$(sha linux-arm64)/" \
            packaging/nutri.rb.tmpl > nutri.rb
          cat nutri.rb

      - name: Push formula to tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/voydz/homebrew-tap.git" tap
          cp nutri.rb tap/Formula/nutri.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/nutri.rb
          git commit -m "nutri ${VERSION}"
          git push
